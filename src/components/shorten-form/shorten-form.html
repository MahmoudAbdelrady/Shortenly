<form class="url-form" [formGroup]="urlShortenForm" (ngSubmit)="onSubmit()">
  <div class="input-field">
    <span>Your long URL</span>
    <div class="input-with-icon">
      <lucide-icon [img]="LinkIcon" [size]="16"></lucide-icon>
      <input
        type="text"
        placeholder="https://example.com/very/long/url/that/needs/shortening"
        formControlName="longUrl"
      />
    </div>
    <form-error
      [field]="urlShortenForm.controls.longUrl"
      [fieldName]="'longUrl'"
      [errorMessages]="{ required: 'URL is required', invalidUrl: 'Enter a valid URL' }"
    />
  </div>
  <div class="input-field">
    <span>Expiry duration</span>
    <div class="dropdown-wrapper" #dropdownWrapper>
      <button
        type="button"
        class="dropdown-trigger"
        [class.open]="dropdownOpen()"
        (click)="toggleDropdown()"
      >
        <div class="trigger-content">
          <lucide-icon [img]="selectedOption().icon" [size]="16"></lucide-icon>
          <span>{{ selectedOption().label }}</span>
        </div>
        <lucide-icon
          [img]="ChevronDownIcon"
          [size]="16"
          class="chevron"
          [class.open]="dropdownOpen()"
        ></lucide-icon>
      </button>
      @if (dropdownOpen()) {
        <ul
          class="dropdown-panel"
          cdkListbox
          formControlName="expiryDuration"
          [cdkListboxValue]="[urlShortenForm.value.expiryDuration]"
          (cdkListboxValueChange)="onOptionSelect($event)"
        >
          @for (option of expiryDurationOptions; track option.value) {
            <li [cdkOption]="option.value" class="dropdown-option">
              <lucide-icon [img]="option.icon" [size]="16"></lucide-icon>
              {{ option.label }}
            </li>
          }
        </ul>
        <form-error
          [field]="urlShortenForm.controls.expiryDuration"
          [fieldName]="'expiryDuration'"
          [errorMessages]="{ required: 'Expiry duration is required' }"
        />
      }
    </div>
  </div>
  <button type="submit">
    <lucide-icon [img]="ZapIcon" [size]="16"></lucide-icon>
    Shorten URL
    <lucide-icon [img]="ArrowRightIcon" [size]="16"></lucide-icon>
  </button>
</form>
