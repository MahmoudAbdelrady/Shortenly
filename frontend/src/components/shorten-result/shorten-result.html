<div class="shorten-result">
  <div class="header">
    <div class="h-icon">
      <svg [lucideIcon]="CheckIcon" [size]="20"></svg>
    </div>
    <div class="h-info">
      <h5>URL Shortened Successfully!</h5>
      <p>Your link is ready to share</p>
    </div>
  </div>
  <div class="content">
    <div class="url-info">
      <span>Short URL</span>
      <div class="url-value">
        <span>{{ resultData().shortUrl }}</span>
        <button
          type="button"
          class="copy-btn"
          [class.copied]="copied()"
          (click)="onCopyClick($event)"
        >
          @if (copied()) {
            <svg [lucideIcon]="CheckIcon" [size]="16"></svg>
            Copied!
          } @else {
            <svg [lucideIcon]="CopyIcon" [size]="16"></svg>
            Copy
          }
        </button>
      </div>
    </div>
    <div class="url-info">
      <span>Original URL</span>
      <div class="url-value">
        <span>{{ resultData().originalUrl }}</span>
      </div>
    </div>
    <div class="url-tags">
      <div class="tag-item">
        <span class="tag-icon"
          ><svg [lucideIcon]="resultData().expiryType.icon ?? null" [size]="12"></svg
        ></span>
        <span class="tag-label">{{ resultData().expiryType.label }}</span>
      </div>
    </div>
  </div>
  <div class="footer">
    <button type="button" class="shorten-btn" (click)="onShortenAnotherClick($event)">
      Shorten Another
    </button>
  </div>
</div>
