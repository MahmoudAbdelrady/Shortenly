name: Image Scan

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy target
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

jobs:
  scan-backend-image:
    name: Scan Backend Image
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'backend' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          tags: shortenly-backend:scan

      - name: Trivy scan (LOW, MEDIUM, HIGH)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-backend:scan
          severity: LOW,MEDIUM,HIGH
          exit-code: "0"

      - name: Trivy scan (CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-backend:scan
          severity: CRITICAL
          exit-code: "1"

  scan-frontend-image:
    name: Scan Frontend Image
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'frontend' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: shortenly-frontend:scan

      - name: Trivy scan (LOW, MEDIUM, HIGH)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-frontend:scan
          severity: LOW,MEDIUM,HIGH
          exit-code: "0"

      - name: Trivy scan (CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-frontend:scan
          severity: CRITICAL
          exit-code: "1"
