name: Main CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy target
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

jobs:
  build-backend:
    name: Build Backend
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'backend' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

  build-frontend:
    name: Build Frontend
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'frontend' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Angular build
        uses: actions/cache@v5
        with:
          path: frontend/.angular/cache
          key: angular-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: angular-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  docker-push-backend:
    name: Build, Scan & Push Backend Image
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'backend' }}
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          tags: shortenly-backend:scan
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Trivy scan (LOW, MEDIUM, HIGH)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-backend:scan
          severity: LOW,MEDIUM,HIGH
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Trivy scan (CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-backend:scan
          severity: CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend image
        run: |
          docker tag shortenly-backend:scan ${{ secrets.DOCKER_USERNAME }}/shortenly-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/shortenly-backend:latest

  docker-push-frontend:
    name: Build, Scan & Push Frontend Image
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'frontend' }}
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: shortenly-frontend:scan
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy scan (LOW, MEDIUM, HIGH)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-frontend:scan
          severity: LOW,MEDIUM,HIGH
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Trivy scan (CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-frontend:scan
          severity: CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push frontend image
        run: |
          docker tag shortenly-frontend:scan ${{ secrets.DOCKER_USERNAME }}/shortenly-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/shortenly-frontend:latest
