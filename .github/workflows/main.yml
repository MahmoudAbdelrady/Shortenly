name: Main CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy target
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

jobs:
  build-backend:
    name: Build Backend
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'backend' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

  build-frontend:
    name: Build Frontend
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'frontend' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Angular build
        uses: actions/cache@v5
        with:
          path: frontend/.angular/cache
          key: angular-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: angular-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  trivy-scan-non-critical:
    name: Trivy Scan (Non-Critical)
    if: ${{ !failure() }}
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy (LOW, MEDIUM, HIGH)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: LOW,MEDIUM,HIGH
          exit-code: "0"

  trivy-scan-critical:
    name: Trivy Scan (Critical)
    if: ${{ !failure() }}
    runs-on: ubuntu-latest
    needs: [trivy-scan-non-critical]
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy (CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"

  docker-push-backend:
    name: Build & Push Backend Image
    if: ${{ !failure() && (inputs.deploy_target == 'all' || inputs.deploy_target == 'backend') }}
    runs-on: ubuntu-latest
    needs: [trivy-scan-critical]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shortenly-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  docker-push-frontend:
    name: Build & Push Frontend Image
    if: ${{ !failure() && (inputs.deploy_target == 'all' || inputs.deploy_target == 'frontend') }}
    runs-on: ubuntu-latest
    needs: [trivy-scan-critical]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/shortenly-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
