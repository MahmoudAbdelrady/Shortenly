name: Main CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy target
        required: true
        default: all
        type: choice
        options:
          - all
          - backend
          - frontend

jobs:
  build-backend:
    name: Build Backend
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'backend' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-

      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

  build-frontend:
    name: Build Frontend
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'frontend' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Angular build
        uses: actions/cache@v5
        with:
          path: frontend/.angular/cache
          key: angular-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: angular-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  docker-push-backend:
    name: Build, Scan & Push Backend Image
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'backend' }}
    runs-on: ubuntu-latest
    needs: [build-backend]
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          tags: shortenly-backend:scan
          build-args: CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Trivy scan (LOW, MEDIUM, HIGH)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-backend:scan
          severity: LOW,MEDIUM,HIGH
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Trivy scan (CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-backend:scan
          severity: CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend image
        id: push
        run: |
          docker tag shortenly-backend:scan ${{ secrets.DOCKER_USERNAME }}/shortenly-backend:latest
          docker tag shortenly-backend:scan ${{ secrets.DOCKER_USERNAME }}/shortenly-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/shortenly-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/shortenly-backend:${{ github.sha }}
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  docker-push-frontend:
    name: Build, Scan & Push Frontend Image
    if: ${{ inputs.deploy_target == 'all' || inputs.deploy_target == 'frontend' }}
    runs-on: ubuntu-latest
    needs: [build-frontend]
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          tags: shortenly-frontend:scan
          build-args: CACHE_BUST=${{ github.run_id }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy scan (LOW, MEDIUM, HIGH)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-frontend:scan
          severity: LOW,MEDIUM,HIGH
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Trivy scan (CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: shortenly-frontend:scan
          severity: CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push frontend image
        id: push
        run: |
          docker tag shortenly-frontend:scan ${{ secrets.DOCKER_USERNAME }}/shortenly-frontend:latest
          docker tag shortenly-frontend:scan ${{ secrets.DOCKER_USERNAME }}/shortenly-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/shortenly-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/shortenly-frontend:${{ github.sha }}
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker-push-backend, docker-push-frontend]
    if: ${{ always() && (needs.docker-push-backend.outputs.pushed == 'true' || needs.docker-push-frontend.outputs.pushed == 'true') }}
    env:
      DEPLOY_BACKEND: ${{ needs.docker-push-backend.outputs.pushed == 'true' }}
      DEPLOY_FRONTEND: ${{ needs.docker-push-frontend.outputs.pushed == 'true' }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Resolve deploy targets
        run: |
          echo "Deploy backend:  $DEPLOY_BACKEND"
          echo "Deploy frontend: $DEPLOY_FRONTEND"
          echo "Image tag:       $IMAGE_TAG"

      - name: Update image version env vars
        run: |
          set -euo pipefail

          payload=$(jq -nc \
            --arg tag "$IMAGE_TAG" \
            --argjson backend "$DEPLOY_BACKEND" \
            --argjson frontend "$DEPLOY_FRONTEND" \
            '{
               data: [
                 (if $backend then {key: "SHORTENLY_BACKEND_VERSION", value: $tag} else empty end),
                 (if $frontend then {key: "SHORTENLY_FRONTEND_VERSION", value: $tag} else empty end)
               ]
             }')

          echo "Request body: $payload"

          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X PATCH "${DEPLOY_URL}/envs/bulk" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "HTTP $status"
          cat response.txt

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to update env vars (HTTP $status)"
            exit 1
          fi

      - name: Start backend application
        if: ${{ env.DEPLOY_BACKEND == 'true' }}
        env:
          APP_ID: ${{ vars.BACKEND_APP_ID }}
        run: |
          set -euo pipefail

          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "${DEPLOY_URL}/applications/${APP_ID}/start?latest=true" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}")

          echo "HTTP $status"
          cat response.txt

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to start backend application (HTTP $status)"
            exit 1
          fi

      - name: Start frontend application
        if: ${{ env.DEPLOY_FRONTEND == 'true' }}
        env:
          APP_ID: ${{ vars.FRONTEND_APP_ID }}
        run: |
          set -euo pipefail

          status=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST "${DEPLOY_URL}/applications/${APP_ID}/start?latest=true" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}")

          echo "HTTP $status"
          cat response.txt

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Failed to start frontend application (HTTP $status)"
            exit 1
          fi
