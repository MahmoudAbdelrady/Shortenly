services:
  sdb-server:
    image: postgres:18-alpine
    container_name: shortenly-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: mahmoudabdelrady/shortenly-backend:latest
    container_name: shortenly-backend
    depends_on:
      sdb-server:
        condition: service_healthy
    environment:
      JAVA_OPTS: -Dspring.profiles.active=prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "8081:8081"

  frontend:
    image: mahmoudabdelrady/shortenly-frontend:latest
    container_name: shortenly-frontend
    depends_on:
      - backend
    ports:
      - "4200:4000"

volumes:
  pgdata:
