services:
  sdb-server:
    image: postgres:18-alpine
    container_name: shortenly-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: mahmoudabdelrady/shortenly-backend:${SHORTENLY_BACKEND_VERSION}
    container_name: shortenly-backend
    depends_on:
      sdb-server:
        condition: service_healthy
    environment:
      JAVA_OPTS: -Dspring.profiles.active=prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", 'wget -q -O - http://localhost:8081/actuator/health/readiness | grep -q ''"status":"UP"''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: mahmoudabdelrady/shortenly-frontend:${SHORTENLY_FRONTEND_VERSION}
    container_name: shortenly-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NG_ALLOWED_HOSTS: ${FRONTEND_ALLOWED_HOSTS}
    ports:
      - "4200:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
